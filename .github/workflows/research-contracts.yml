name: Research contracts

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Reject unsafe research invocations and dead verification
        run: >-
          uv run pytest -q
          neural_assemblies/tests/test_research_contracts.py
          neural_assemblies/tests/test_exact_engine_ladder.py
          neural_assemblies/tests/test_sampled_fiber_learning.py
          neural_assemblies/tests/test_exact_fiber_learning.py
          neural_assemblies/tests/test_fiber_learning_contract.py
          neural_assemblies/tests/test_reinforcement_contract.py
          neural_assemblies/tests/test_winner_injection_contract.py
          neural_assemblies/tests/test_brain_ir_execution.py
          neural_assemblies/tests/test_projection_ir_execution.py
          neural_assemblies/tests/test_protocol_wire.py
          neural_assemblies/tests/test_source_inventory.py
          neural_assemblies/tests/test_research_runner.py
          neural_assemblies/tests/test_capacity_runner_contract.py
          neural_assemblies/tests/test_research_harness.py
          neural_assemblies/tests/test_area_registration.py
          neural_assemblies/tests/test_public_model_boundaries.py
          neural_assemblies/tests/test_operation_semantic_cards.py
          neural_assemblies/tests/test_projection_rounds_contract.py
          neural_assemblies/tests/test_probe_state_contract.py
          neural_assemblies/tests/test_context_observation.py
          neural_assemblies/tests/test_role_observation.py
          neural_assemblies/tests/test_classification_observation.py
          neural_assemblies/tests/test_classification_evidence.py
          neural_assemblies/tests/test_clone_contract.py
          neural_assemblies/tests/test_parser_fork_contract.py
          neural_assemblies/tests/test_parser_cache_identity.py
          neural_assemblies/tests/test_checkpoint_storage.py
          neural_assemblies/tests/test_mixed_drive_indices.py
          neural_assemblies/tests/test_explicit_input_contract.py
          neural_assemblies/tests/test_explicit_projection.py
          neural_assemblies/tests/test_erp_protocol.py
          neural_assemblies/tests/test_read_only_probes.py
          neural_assemblies/tests/test_specification_links.py
          neural_assemblies/tests/test_migration_comparison.py
          neural_assemblies/tests/test_golden_comparator_contract.py
          neural_assemblies/tests/test_theory_citations.py
          neural_assemblies/tests/test_methodology_ratchet.py
          neural_assemblies/tests/test_index_space_ratchet.py
          neural_assemblies/tests/test_docs_examples_smoke.py

  lean-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: "false"
          leanchecker: "true"

  rust-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the shared protocol corpus
        working-directory: crates
        run: cargo test --locked -p assembly-ir
